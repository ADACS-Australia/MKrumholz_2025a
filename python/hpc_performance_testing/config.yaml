hpc:
  cluster: NT # support none (default: NT), setonix, gadi
  scheduler: slurm  
  shell: /bin/bash
  env_setup_script: env_setup.sh
  gpu_build: cuda # cuda, hip
  ntasks_per_node: 4 # max number of tasks per node
  ncpus_per_task:
  partition:
  

paths:
  working_dir: ./
  test_inputs: ~/ADACS/repo/MKrumholz_2025a/tests_input

scaling:
  strategy: weak_3d
  min_cores: # default value: 1
  max_cores: 64

tests:
  - name: test_hydro3d_blast
    target: HydroBlast3D/test_hydro3d_blast
    input_file: blast_32.in
    cmake_cache:
      - -DCMAKE_BUILD_TYPE=Release 
      - -DQUOKKA_PYTHON=OFF 
      - -DAMReX_SPACEDIM=3
    job_settings:
      time_limit: 00:10:00
      memory: 4G
    

 