hpc:
  cluster: NT # nt, setonix, gadi, frontier
  scheduler: slurm  
  gpu_build: cuda # cuda, hip
  shell: /bin/bash
  
paths:
  working_dir: ./
  environment: env_setup.sh
  test_inputs: ~/ADACS/repo/MKrumholz_2025a/tests_input

global_job_settings:
  ntasks_per_node: 4 # max number of tasks per node
  mem_per_node: 4G
  

scaling:
  strategy: weak_3d
  min_cores: # default value: 1
  max_cores: 10

tests:
  - name: test_hydro3d_blast
    target: HydroBlast3D/test_hydro3d_blast
    input_file: blast_unigrid_128_regression.in
    cmake_cache:
      - -DCMAKE_BUILD_TYPE=Release 
      - -DQUOKKA_PYTHON=OFF 
      - -DAMReX_SPACEDIM=3
    job_settings:
      walltime: 00:30:00
      mem_per_node: 10G
  
  - name: test_radhydro3d_shell
    target: RadhydroShell/test_radhydro3d_shell
    input_file: radhydro_shell_regression.in
    link_file: ./initial_conditions.txt
    cmake_cache: 
      - -DCMAKE_BUILD_TYPE=Release
      - -DQUOKKA_PYTHON=OFF 
      - -DAMReX_SPACEDIM=3
    job_settings:
      walltime: 00:30:00
      mem_per_node: 10G
  

 