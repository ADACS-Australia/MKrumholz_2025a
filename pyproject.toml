[tool.poetry]
name = "hpc_performance_testing"
version = "0.0.0-dev" # Just a place holder; package version is managed by the dynamic-versioning plugin & git tags
description = "Automate performance testing on a HPC"
authors = [ "JHU" ]
license = "MIT-expat"
readme = "README.md"
packages = [
    { include = "hpc_performance_testing", from = "python" },
    { include = "cli"}
]

include = [
    "python/hpc_performance_testing/templates/**/*",
]

homepage = "https://github.com/ADACS-Australia/MKrumholz_2025a"
documentation = "https://hpc_performance_testing.readthedocs.io/en/latest/"

[tool.poetry.dependencies]
python = " >=3.10"
rich = "^13"
cookiecutter = "^2"
jinja2 = "3.1.*"
pandas = "^2.2.2"
fastparquet = "^2024.11.0"
pydantic = "^2.11.7"
matplotlib = "^3.9.0"
numpy = "^1.26.0"
pyyaml = "^6.0"
plotly = "^5.0.0"

[tool.poetry.group.docs.dependencies]
Sphinx = "^6"
sphinx-rtd-theme = "^1"
sphinx-click = "^4"
sphinx-copybutton = "^0"
myst-parser = "^1"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
pytest-mock = "^3"
pytest-cookies = "^0"
pytest-cov = "^5"
black = "^24"
ruff = "^0"
mypy = "^1"
pre-commit = "^3"

# This configures the Poetry plugin which enables dynamic versioning via the repo tags
# Note the changes that are also needed to the [build-system] config below.
[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"

[tool.pytest.ini_options]
addopts = "--cov"
pythonpath = "./python" # relative to root directory

# Uncomment and edit the following line to add custom markers to your tests
# These can be run with the following (for example):
#
#   $ pytest -m marker_name
#
#markers = [ "marker_name: A short description of the marker" ]

[tool.poetry.scripts]
hptest = "cli.pipeline:main"

[tool.mypy]
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/python"

[tool.coverage.paths]
source = ["python"]

[tool.coverage.run]
branch = true
source = ["python"]
omit = ["python/hpc_performance_testing/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:"
]

[tool.ruff]
line-length = 88 # to match Black

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E501", # line length violations (let Black handle this)
]


# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"
